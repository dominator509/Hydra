[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = [
  { crate = "webpki-roots@1.0.8", allow = ["CDLA-Permissive-2.0"] },
  # Pulled in by the vault/age dependency tree (via rustls 0.23); same
  # CDLA-Permissive-2.0 license as the 1.0.8 exception above.
  { crate = "webpki-roots@0.26.11", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
