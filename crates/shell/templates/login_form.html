<form method="post" action="/login">
    {{ csrf_field|safe }}
    {% match error %}
    {% when Some with (msg) %}
    <div class="flash flash-error">{{ msg }}</div>
    {% when None %}
    {% endmatch %}
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="{% if development_mode %}any value (dev mode){% else %}Username{% endif %}">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="{% if development_mode %}any value (dev mode){% else %}Password{% endif %}">
    </div>
    <button type="submit">{% if development_mode %}Dev Login{% else %}Sign In{% endif %}</button>
</form>
