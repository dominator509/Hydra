<form method="post" action="/login">
    {{ csrf_field|safe }}
    {% match error %}
    {% when Some with (msg) %}
    <div class="flash flash-error">{{ msg }}</div>
    {% when None %}
    {% endmatch %}
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="any value (dev mode)">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="any value (dev mode)">
    </div>
    <button type="submit">Dev Login</button>
</form>
