name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hydra:hydra@127.0.0.1:5432/hydra
      NATS_URL: nats://127.0.0.1:4222
      HYDRA_BIND: 127.0.0.1:8080
      HYDRA_BASE_URL: http://127.0.0.1:8080
      HYDRA_ENV: dev
      HYDRA_VAULT_KEY: CI_VAULT_KEY_PLACEHOLDER
      POSTGRES_PASSWORD: hydra
      RUST_LOG: info,hydra=debug
      TK_HIT_RATIO_TARGET: "0.97"
      TK_OUTPUT_BUDGET_BYTES: "16384"
    services:
      postgres:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_DB: hydra
          POSTGRES_PASSWORD: hydra
          POSTGRES_USER: hydra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydra -d hydra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Start JetStream
        run: |
          docker run --detach --name hydra-ci-nats --publish 4222:4222 --publish 8222:8222 nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927 -js -m 8222
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8222/jsz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs hydra-ci-nats
          exit 1
      - name: Install repo toolchain
        run: bash scripts/install.sh
      - name: Nexus auth and MCP contracts
        run: |
          cargo test -p fabric nexus_auth -- --nocapture
          cargo test -p fabric mcp_contract -- --nocapture
      - name: Event contract and relay
        run: cargo test -p hydra-kernel integration_event_bridge -- --nocapture --test-threads=1
      - name: Fake Nexus round trip
        run: bash scripts/test-e2e.sh
      - name: Security and dependency policy
        run: |
          bash scripts/security-check.sh
          bash scripts/dependency-audit.sh
      - name: Validate container package
        run: |
          docker build -f docker/Dockerfile -t hydra/kernel:ci .
          docker build -f docker/egress-proxy.Dockerfile -t hydra/egress-proxy:ci .
          docker compose -f docker/compose.yaml config
      - name: Verify workspace
        run: bash scripts/verify.sh
