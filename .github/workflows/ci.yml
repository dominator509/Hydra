name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hydra:hydra@127.0.0.1:5432/hydra
      NATS_URL: nats://127.0.0.1:4222
      HYDRA_BIND: 127.0.0.1:8080
      HYDRA_BASE_URL: http://127.0.0.1:8080
      HYDRA_ENV: ci
      HYDRA_VAULT_KEY: CI_VAULT_KEY_PLACEHOLDER
      RUST_LOG: info,hydra=debug
      TK_HIT_RATIO_TARGET: "0.97"
      TK_OUTPUT_BUDGET_BYTES: "16384"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydra
          POSTGRES_PASSWORD: hydra
          POSTGRES_USER: hydra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydra -d hydra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --entrypoint nats-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install repo toolchain
        run: bash scripts/install.sh
      - name: Verify workspace
        run: bash scripts/verify.sh
