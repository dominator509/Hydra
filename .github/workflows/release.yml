# .github/workflows/release.yml — Hydra release pipeline
# Triggered by any tag matching v* (e.g., v0.1.0, v1.2.3-rc1).
#
# Environment variables (set in GitHub secrets or org variables):
#   REGISTRY         — Container registry URL (e.g., ghcr.io/myorg)
#   REGISTRY_USER    — Registry username (if required)
#   REGISTRY_PASS    — Registry password/token
#   STAGING_HOST     — SSH hostname for staging deploy
#   STAGING_USER     — SSH user for staging deploy
#   STAGING_SSH_KEY  — SSH private key for staging deploy

name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hydra:hydra@127.0.0.1:5432/hydra
      NATS_URL: nats://127.0.0.1:4222
      HYDRA_BIND: 127.0.0.1:8080
      HYDRA_BASE_URL: http://127.0.0.1:8080
      HYDRA_ENV: dev
      HYDRA_VAULT_KEY: CI_VAULT_KEY_PLACEHOLDER
      RUST_LOG: info,hydra=debug
      TK_HIT_RATIO_TARGET: "0.97"
      TK_OUTPUT_BUDGET_BYTES: "16384"
    services:
      postgres:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_DB: hydra
          POSTGRES_PASSWORD: hydra
          POSTGRES_USER: hydra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydra -d hydra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Start JetStream
        run: |
          docker run --detach --name hydra-release-nats --publish 4222:4222 --publish 8222:8222 nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927 -js -m 8222
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8222/jsz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs hydra-release-nats
          exit 1
      - name: Install toolchain
        run: bash scripts/install.sh
      - name: Verify workspace
        run: bash scripts/verify.sh

  build-and-push:
    name: Build and push Docker image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ${{ vars.REGISTRY || secrets.REGISTRY || 'ghcr.io' }}
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      egress_image_digest: ${{ steps.push-egress.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        if: env.REGISTRY != 'ghcr.io' || github.actor != 'nektos/act'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASS || secrets.GITHUB_TOKEN }}
      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/hydra/kernel:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/hydra/kernel
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Build and push egress proxy
        id: push-egress
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/egress-proxy.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/hydra/egress-proxy:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest egress proxy provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/hydra/egress-proxy
          subject-digest: ${{ steps.push-egress.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  deploy-staging:
    name: Deploy to staging
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]
    if: github.repository_owner == 'Dominator509'
    env:
      REGISTRY: ${{ vars.REGISTRY || secrets.REGISTRY || 'ghcr.io' }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Deploy to staging
        run: |
          bash scripts/deploy-staging.sh "${{ steps.tag.outputs.tag }}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          STAGING_EGRESS_DIGEST: ${{ needs.build-and-push.outputs.egress_image_digest }}
          STAGING_SMOKE_URL: ${{ secrets.STAGING_SMOKE_URL }}
