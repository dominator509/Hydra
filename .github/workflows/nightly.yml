name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hydra:hydra@127.0.0.1:5432/hydra
      NATS_URL: nats://127.0.0.1:4222
      HYDRA_BIND: 127.0.0.1:8080
      HYDRA_BASE_URL: http://127.0.0.1:8080
      HYDRA_ENV: dev
      HYDRA_VAULT_KEY: CI_VAULT_KEY_PLACEHOLDER
      RUST_LOG: info,hydra=debug
      TK_HIT_RATIO_TARGET: "0.97"
      TK_OUTPUT_BUDGET_BYTES: "16384"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydra
          POSTGRES_PASSWORD: hydra
          POSTGRES_USER: hydra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydra -d hydra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Start JetStream
        run: |
          docker run --detach --name hydra-nightly-nats --publish 4222:4222 --publish 8222:8222 nats:2.10-alpine -js -m 8222
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8222/jsz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs hydra-nightly-nats
          exit 1

      - name: Install repo toolchain
        run: bash scripts/install.sh

      - id: verify
        name: Verify workspace
        run: bash scripts/verify.sh

      - id: conformance
        name: Run conformance (ignored tests)
        run: |
          cargo test -p bridge-host --test conformance -- --ignored --nocapture
          echo "## Conformance (ignored) results" >> $GITHUB_STEP_SUMMARY
          echo "Required nightly soak tests passed." >> $GITHUB_STEP_SUMMARY

      - id: cache-hit-audit
        name: Cache-hit audit
        run: bash scripts/cache-hit-audit.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Nightly Run Summary (${{ github.run_id }})"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Verify workspace | ${{ steps.verify.outcome }} |"
            echo "| Conformance (ignored) | ${{ steps.conformance.outcome }} |"
            echo "| Cache-hit audit | ${{ steps.cache-hit-audit.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY
