services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hydra
      POSTGRES_PASSWORD: hydra
      POSTGRES_USER: hydra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - hydra-postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  hydra-postgres-data:
