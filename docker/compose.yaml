# docker/compose.yaml - Hydra standalone and Nexus-connected reference topology
# See DEPLOYMENT.md and NEXUS_PACKAGE_CONTRACT.md before using this outside dev.
#
# Only Caddy publishes host ports. Kernel, Postgres, and NATS remain on separate
# internal networks. The egress proxy is the only application-side component
# attached to an external-egress network.

x-kernel-env: &kernel-env
  HYDRA_BIND: "0.0.0.0:8080"
  HYDRA_BASE_URL: "${HYDRA_BASE_URL:-https://localhost}"
  HYDRA_ENV: "${HYDRA_ENV:-dev}"
  DATABASE_URL: "postgres://hydra:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/hydra"
  NATS_URL: "nats://nats:4222"
  HYDRA_VAULT_KEY: "${HYDRA_VAULT_KEY:?HYDRA_VAULT_KEY must be set}"
  DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  OPENAI_COMPAT_BASE_URL: "${OPENAI_COMPAT_BASE_URL:-}"
  OPENAI_COMPAT_MODEL: "${OPENAI_COMPAT_MODEL:-}"
  TK_HIT_RATIO_TARGET: "${TK_HIT_RATIO_TARGET:-0.97}"
  TK_OUTPUT_BUDGET_BYTES: "${TK_OUTPUT_BUDGET_BYTES:-16384}"
  HYDRA_GOVERNOR_MONTHLY_SPEND_CAP_CENTS: "${HYDRA_GOVERNOR_MONTHLY_SPEND_CAP_CENTS:-50000}"
  HYDRA_GOVERNOR_PII_EGRESS_ALLOWLIST: "${HYDRA_GOVERNOR_PII_EGRESS_ALLOWLIST:-private}"
  HYDRA_GOVERNOR_BLAST_ENTITIES_CEILING: "${HYDRA_GOVERNOR_BLAST_ENTITIES_CEILING:-250}"
  HYDRA_GOVERNOR_BLAST_SENDS_CEILING: "${HYDRA_GOVERNOR_BLAST_SENDS_CEILING:-50}"
  HYDRA_GOVERNOR_BLAST_MONEY_CEILING_CENTS: "${HYDRA_GOVERNOR_BLAST_MONEY_CEILING_CENTS:-250000}"
  NEXUS_INTEGRATION_ENABLED: "${NEXUS_INTEGRATION_ENABLED:-false}"
  NEXUS_OIDC_ISSUER: "${NEXUS_OIDC_ISSUER:-}"
  NEXUS_OIDC_AUDIENCE: "${NEXUS_OIDC_AUDIENCE:-}"
  NEXUS_OIDC_JWKS_URL: "${NEXUS_OIDC_JWKS_URL:-}"
  NEXUS_OIDC_PUBLIC_KEY_FILE: "${NEXUS_OIDC_PUBLIC_KEY_FILE:-}"
  NEXUS_OIDC_ALLOWED_ALGORITHMS: "${NEXUS_OIDC_ALLOWED_ALGORITHMS:-RS256}"
  NEXUS_ALLOWED_MCP_ORIGINS: "${NEXUS_ALLOWED_MCP_ORIGINS:-}"
  NEXUS_JWKS_CACHE_SECONDS: "${NEXUS_JWKS_CACHE_SECONDS:-300}"
  NEXUS_OIDC_CLOCK_SKEW_SECONDS: "${NEXUS_OIDC_CLOCK_SKEW_SECONDS:-30}"
  NEXUS_MCP_MAX_REQUEST_BYTES: "${NEXUS_MCP_MAX_REQUEST_BYTES:-1048576}"
  NEXUS_APPROVAL_AUTH_STRENGTHS: "${NEXUS_APPROVAL_AUTH_STRENGTHS:-mfa}"
  RUST_LOG: "${RUST_LOG:-info,hydra=info}"
  HTTP_PROXY: "http://egress-proxy:8888"
  HTTPS_PROXY: "http://egress-proxy:8888"
  NO_PROXY: "localhost,127.0.0.1,postgres,nats,kernel,caddy,egress-proxy"

services:
  kernel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: "hydra/kernel:${HYDRA_TAG:-latest}"
    expose:
      - "8080"
    environment:
      <<: *kernel-env
    volumes:
      - hydra-kernel-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      egress-proxy:
        condition: service_started
    restart: unless-stopped
    networks:
      - ingress-internal
      - data-internal
      - events-internal
      - proxy-internal
    dns:
      - 127.0.0.11

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      kernel:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ingress-internal
      - ingress-external

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hydra
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_USER: hydra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hydra-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - data-internal

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    expose:
      - "4222"
      - "8222"
    volumes:
      - hydra-nats-data:/data
    restart: unless-stopped
    networks:
      - events-internal

  egress-proxy:
    image: alpine:3.20
    command:
      - sh
      - -c
      - apk add --no-cache tinyproxy && exec tinyproxy -d -c /egress-proxy.conf
    expose:
      - "8888"
    volumes:
      - ./egress-proxy.conf:/egress-proxy.conf:ro
    restart: unless-stopped
    networks:
      - proxy-internal
      - egress-external

  migrate:
    profiles:
      - ops
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: "hydra/kernel:${HYDRA_TAG:-latest}"
    environment:
      DATABASE_URL: "postgres://hydra:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/hydra"
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-internal

volumes:
  hydra-postgres-data:
  hydra-nats-data:
  hydra-kernel-data:
  caddy-data:
  caddy-config:

networks:
  ingress-internal:
    driver: bridge
    internal: true
  data-internal:
    driver: bridge
    internal: true
  events-internal:
    name: "${HYDRA_EVENTS_NETWORK:-hydra-events}"
    driver: bridge
    internal: true
    attachable: true
  proxy-internal:
    driver: bridge
    internal: true
  ingress-external:
    driver: bridge
  egress-external:
    driver: bridge
