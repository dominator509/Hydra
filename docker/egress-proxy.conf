# docker/egress-proxy.conf — Tinyproxy allowlist configuration
# Only kernel and localhost are permitted; all other connections denied.

# Basic settings
Port 8888
Timeout 60
LogLevel Info
Syslog Off

# Allowlist — only trusted sources
Allow 127.0.0.1
Allow ::1
Allow kernel
Allow 172.0.0.0/8
Allow 10.0.0.0/8

# Deny all other connections by default
Deny 0.0.0.0/0
Deny ::/0

# Security hardening
ViaProxyName "egress-proxy"
DisableViaHeader Off
