# docker/egress-proxy.conf - Tinyproxy source allowlist configuration
# Destination authority remains in Hydra's BridgeHost grants. This proxy is a
# network choke point and accepts callers only from its isolated internal link.

# Basic settings
User tinyproxy
Group tinyproxy
Listen 0.0.0.0
Port 8888
Timeout 60
LogLevel Info
Syslog Off

# Source allowlist. Only kernel joins proxy-internal in the base topology.
Allow 127.0.0.1
Allow ::1
Allow 172.16.0.0/12
Allow 10.0.0.0/8
Allow 192.168.0.0/16

# Deny all other connections by default
Deny 0.0.0.0/0
Deny ::/0

# Security hardening
ViaProxyName "egress-proxy"
DisableViaHeader Off
