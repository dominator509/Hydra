[workspace]
members = [
  "crates/kernel",
  "crates/cdm",
  "crates/governor",
  "crates/store",
  "crates/bridge-host",
  "crates/bridge-wit",
  "crates/llm-router",
  "crates/tokenkiller",
  "crates/agents",
  "crates/fabric",
  "crates/shell",
  "fixtures/adapter-memcrm",
  "fixtures/adapter-suitelike",
]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false
rust-version = "1.96.1"
version = "0.1.0"

[workspace.dependencies]
anyhow = { version = "1.0.103" }
argon2 = { version = "0.5.3", features = ["std"] }
askama = { version = "0.12.1", default-features = false, features = ["serde_json"] }
async-trait = { version = "0.1.89" }
async-nats = { version = "0.49.1", default-features = false, features = ["ring"] }
axum = { version = "0.7.5" }
hmac = { version = "0.12.1" }
jsonschema = { version = "0.18.3" }
password-hash = "0.5.0"
rand_core = { version = "0.6" }
proptest = { version = "1.6.0" }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ryu = { version = "1.0.23" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128" }
sha2 = { version = "0.10.9" }
sqlx = { path = "vendor/sqlx", version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json", "time"] }
thiserror = { version = "1.0.64" }
time = { version = "0.3.36", features = ["formatting"] }
tokio = { version = "1.40.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "json", "registry"] }
unicode-normalization = { version = "0.1.25" }
uuid = { version = "1.10.0", features = ["serde", "v4"] }
wasmtime = { version = "38.0.4", features = ["async", "component-model"] }
wasmtime-wasi = { version = "38.0.4" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[patch.crates-io]
sqlx-macros-core = { path = "vendor/sqlx-macros-core" }
